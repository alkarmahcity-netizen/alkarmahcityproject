.sheet{margin-bottom:12px;height:297mm;overflow:hidden}.sheet table.d td,.sheet table.s td{position:static;background-clip:padding-box}.sheet table.d td:not(.k):not(.k2){background:none}.sheet .hd .pname{font-size:10pt}.sheet .appr2{gap:4mm;margin-top:6mm}.sheet .appr3{grid-template-columns:1fr 1fr 1fr;gap:4mm;margin-top:4mm}.sheet .appr2 div,.sheet .appr3 div{min-height:34mm}

.pg{--g:#1f6b3a;--g2:#e9f4ec;--au:#b08a2e;--bl:#2563a8;--ink:#14201a;--mu:#5a6b61;width:210mm;height:297mm;background:#fff;color:var(--ink);margin:0 auto 14px;position:relative;padding:8mm 11mm 13mm;box-shadow:0 3px 18px rgba(10,30,20,.25);font-family:var(--ff,Arial,'Helvetica Neue',sans-serif);font-size:calc(12.5px*var(--k,1)*var(--fz,1));line-height:calc(1.5*var(--lh,1));overflow:hidden;display:flex;flex-direction:column;gap:1.1mm}

.pg .apps .sg .ln{height:calc(7mm*var(--sgh,1))}.pg .prevs{display:flex;flex-wrap:wrap;gap:1.2mm;align-items:center;border:1px solid #e6d9b4;border-radius:2mm;padding:.7mm 1.6mm;background:linear-gradient(90deg,#fbf6e8,#fff)}.pg .pv.none{color:var(--mu);font-weight:600;justify-content:center}.pg .prevs .pvh{align-self:center;font-weight:700;color:var(--g);font-size:.9em;padding-inline-end:1mm}.pg .pv{border:1px solid #cfdcd2;border-right:1.2mm solid var(--au);border-radius:1.6mm;background:#fbfdfb;padding:.4mm 2.4mm;font-size:.8em;line-height:1.3;display:flex;flex-direction:row;gap:2.4mm;align-items:baseline}.pg .pv b{color:var(--g)}.pg .pv em{font-style:normal;font-weight:700}.pg .tile.wr b{white-space:normal;line-height:1.35;font-size:.95em}.pg .sg .hon{color:#000;min-height:1.35em;font-weight:700;line-height:1.35}.pg .sigs,.pg .apps{padding-top:var(--sgg,0mm)}.pg .annx{border:1px solid #d8e2da;border-radius:1.8mm;padding:.8mm 3mm;font-size:.88em;background:#fbfdfb}.pg .annx b{color:var(--g)}
.pg .ft{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.72em;border-top:1px solid #dde6df;padding-top:1mm}

function splitMembers(s){s=String(s||'').replace(/\r/g,'\n').replace(/(السيدة|السيد|الفنية|الفني)(?=[\u0621-\u064A.])/g,'$1 ').replace(/م\s*\.\s*السيد(ة?)/g,'السيد$1').replace(/(الفنية|الفني|السيدة|السيد|المهندسة|المهندس)\s*\/\s*/g,'$1 ').replace(/(^|[\s\/])م\s*\/\s*/g,'$1م.');

  const role=/^م[.\/]$|^المهندس|مهندس/.test(p)?'eng':/^الفني/.test(p)?'tech':/^السيد/.test(p)?'staff':'';return {raw,name,key:nk(name),role};}

/* ---------- المشاريع المكررة: الأمر الإداري نفسه يُعاد (إعادة تشكيل، تعديل الكشف، أو يرد في سنتين) ----------
   مفتاح التشابه: اسم المشروع بعد توحيد الإملاء وحذف المسافات والرموز؛ وتشابه كلمات ≥ 85% في القضاء نفسه.
   المجموعة يبقى منها الأمر الأحدث «رئيسياً»، والبقية dupOf = معرّفه (تُعرض «أوامر سابقة لنفس المشروع») ولا تُحسب مرة ثانية في المبالغ ولا على المهندسين.
   «ليس مكرراً» (notDup) يفصل المشروع نهائياً. */
const simKey=p=>nk(p.name).replace(/[^\u0621-\u064A0-9]/g,'');

function simGroups(){const L=P().filter(p=>p.kind!=='add'&&!p.notDup&&simKey(p).length>6),par=new Map(L.map(p=>[p.id,p.id]));
  const f=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;},u=(a,b)=>{a=f(a);b=f(b);if(a!==b)par.set(a,b);};
  const byK=new Map();L.forEach(p=>{const k=simKey(p);if(byK.has(k))u(byK.get(k),p.id);else byK.set(k,p.id);});
  const T=L.map(p=>[p,simToks(p)]);
  for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++){const [a,A]=T[i],[b,Bt]=T[j];if(A.size<4||Bt.size<4)continue;if(a.district&&b.district&&a.district!==b.district)continue;
    if(simNums(a)!==simNums(b))continue;   /* «حي الفارق 1» و«2»، «القناة 3/8» و«1/4»: أرقام مختلفة = مشروعان */
    let n=0;A.forEach(w=>{if(Bt.has(w))n++;});if(n/(A.size+Bt.size-n)>=0.85)u(a.id,b.id);}
  const G=new Map();L.forEach(p=>{const r=f(p.id);(G.get(r)||G.set(r,[]).get(r)).push(p);});
  return [...G.values()].filter(g=>g.length>1);}
function dedupe(){let moved=0,n=0;P().forEach(p=>{if(p.dupOf&&!P().some(x=>x.id===p.dupOf))delete p.dupOf;});
  simGroups().forEach(g=>{g.sort((a,b)=>(b.orderDate||'').localeCompare(a.orderDate||'')||num(b.orderNo)-num(a.orderNo));const m=g[0];
    if(m.dupOf){delete m.dupOf;}g.slice(1).forEach(d=>{if(d.dupOf!==m.id){d.dupOf=m.id;d.updated=Date.now();n++;}
      /* ملف التخصيصات يكرر السلفة التشغيلية نفسها على كل أوامر المشروع: السلفة المطابقة (الرقم والمبلغان والتاريخ) لا تُنقل مرة ثانية */
      if((d.advances||[]).length){const add=d.advances.filter(a=>a.audit||!(m.advances||[]).some(b=>sameAdv(a,b)));m.advances=(m.advances||[]).concat(add.map(a=>Object.assign(a,{note:[a.note,'من الأمر '+(d.orderNo||'')].filter(Boolean).join(' — ')})));d.advances=[];if(add.length)moved++;m.updated=Date.now();}
      ['lat','lng','sector','beneficiary','startDate','doneDate'].forEach(k=>{if(!m[k]&&d[k])m[k]=d[k];});if(!num(m.progress)&&num(d.progress))m.progress=d.progress;});});
  return {n,moved};}
const sameAdv=(x,y)=>String(x.no||'').trim()===String(y.no||'').trim()&&Math.round(num(x.raised))===Math.round(num(y.raised))&&Math.round(num(x.paid))===Math.round(num(y.paid))&&(x.date||'')===(y.date||'');

function tafqit(n){n=Math.round(num(n));if(!n)return 'صفر';
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],hund=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const tri=x=>{const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(hund[h]);if(r){if(r<20)p.push(ones[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?ones[o]+' و'+tens[t]:tens[t]);}}return p.join(' و');};
  const sc=[['','',''],['ألف','ألفان','آلاف'],['مليون','مليونان','ملايين'],['مليار','ملياران','مليارات']];const parts=[];let i=0;
  while(n>0&&i<4){const g=n%1000;if(g){let w;if(i===0)w=tri(g);else if(g===1)w=sc[i][0];else if(g===2)w=sc[i][1];else if(g>=3&&g<=10)w=tri(g)+' '+sc[i][2];else w=tri(g)+' '+sc[i][0];parts.unshift(w);}n=Math.floor(n/1000);i++;}
  return parts.join(' و');}

/* ---------- الخريطة (حدود الأقضية من البرنامج، بلا إنترنت) ---------- */
const G=window.ANBAR_GEO||null;
const BB={minLat:30.9,maxLat:35.3,minLng:38.6,maxLng:44.4},W=1000,H=Math.round(W*(BB.maxLat-BB.minLat)/(BB.maxLng-BB.minLng)*1.18);
function inPoly(lat,lng,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [ya,xa]=poly[i],[yb,xb]=poly[j];if(((ya>lat)!==(yb>lat))&&(lng<(xb-xa)*(lat-ya)/(yb-ya)+xa))ins=!ins;}return ins;}
const distAt=(lat,lng)=>{if(!G)return '';const d=G.dists.find(d=>inPoly(lat,lng,d.p));return d?d.n:'';};
/* x من الغرب الى الشرق (الشرق يمين الخريطة) */
const X=(lat,lng)=>[(lng-BB.minLng)/(BB.maxLng-BB.minLng)*W,(BB.maxLat-lat)/(BB.maxLat-BB.minLat)*H];
function mapSvg(points,small){if(!G)return '<div class="empty">حدود الأقضية غير متاحة</div>';
  const path=poly=>'M'+poly.map(([la,ln])=>X(la,ln).map(v=>v.toFixed(1)).join(',')).join('L')+'Z';
  const cen=poly=>{let a=0,b=0;poly.forEach(([la,ln])=>{a+=la;b+=ln;});return X(a/poly.length,b/poly.length);};
  return `<svg class="map" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${G.dists.map(d=>`<path class="d" d="${path(d.p)}"><title>${esc(d.n)}</title></path>`).join('')}
   ${small?'':G.dists.map(d=>{const [x,y]=cen(d.p);return `<text x="${x}" y="${y}" text-anchor="middle">${esc(d.n)}</text>`;}).join('')}
   ${points.map(p=>{const [x,y]=X(p.lat,p.lng);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${small?7:5}" fill="${p.color||'#7a4e12'}" data-open="${p.id||''}"><title>${esc(p.t||'')}</title></circle>`;}).join('')}</svg>`;}
const stColor={new:'#8a7f6b',run:'#2563a8',done:'#1f7a3d',recv:'#0f766e',stop:'#b42318'};
function rMap(){const ps=P().filter(p=>inYear(p)&&isProj(p)),wc=ps.filter(p=>p.lat&&p.lng),no=ps.filter(p=>!(p.lat&&p.lng));
  const pts=wc.map(p=>({id:p.id,lat:+p.lat,lng:+p.lng,color:stColor[p.status||'new'],t:`${p.name}\n${fm(calc(p).amt)} د — إنجاز ${pc(p.progress)}`}));
  const mism=wc.filter(p=>{const d=distAt(+p.lat,+p.lng);return d&&p.district&&nk(d)!==nk(p.district)&&!['الحبانية','الصقلاوية','العامرية','النخيب','الخالدية'].includes(p.district);});

   <div class="card"><h4>مشاريع بلا إحداثيات (${no.length})</h4><p class="hint">اكتب الإحداثيات بصيغة «33.4215, 43.3021» أو الصق رابط خرائط Google، ثم Enter.</p>
   <div class="tw" style="max-height:60vh"><table><thead><tr><th>المشروع</th><th>القضاء</th><th style="min-width:200px">الإحداثيات</th></tr></thead><tbody>
   ${no.slice(0,400).map(p=>`<tr><td><a href="#" data-open="${p.id}">${esc(p.name)}</a><div class="sub">أمر ${esc(p.orderNo)} — ${yearOf(p)}</div></td><td>${esc(p.district)}</td><td><input data-ll="${p.id}" placeholder="خط العرض, خط الطول" style="width:100%"></td></tr>`).join('')}</tbody></table></div>
   ${mism.length?`<h4 style="margin-top:12px" class="warn">⚠ إحداثيات تقع خارج القضاء المسجل (${mism.length})</h4>${mism.map(p=>`<div class="sub"><a href="#" data-open="${p.id}">${esc(p.name)}</a>: المسجل ${esc(p.district)} — حسب الإحداثيات ${esc(distAt(+p.lat,+p.lng))}</div>`).join('')}`:''}</div></div>`;}
/* «33.42, 43.30» أو رابط Google (@lat,lng أو q=lat,lng) أو أرقام عربية */
function parseLL(s){s=String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.');const m=/@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(s)||/[?&](?:q|ll|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/.exec(s)||/(-?\d{1,3}\.\d+)\s*[,،\s]\s*(-?\d{1,3}\.\d+)/.exec(s);
  if(!m)return null;let a=+m[1],b=+m[2];if(a>=38.5&&b<38.5){const t=a;a=b;b=t;}/* العراق: خط العرض 29–38 وخط الطول 38.5–49 */return {lat:a,lng:b};}

function fitPg(root){root.querySelectorAll('.pg').forEach(pg=>{let k=1;pg.style.setProperty('--k',k);const over=()=>pg.scrollHeight>pg.clientHeight+1;for(let n=0;n<45&&k>0.55&&over();n++){k-=0.01;pg.style.setProperty('--k',k.toFixed(3));}

function audPreview(p,a){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="box" style="width:auto;background:#d9dfdb"><div class="row" style="margin-bottom:8px"><button class="pri" data-x="print">🖨 طباعة</button>${DESK&&DESK.pdf?'<button data-x="pdf">💾 PDF</button>':''}<button data-x="close">إغلاق</button><span class="hint">الصفحة الأولى استمارة القرار، والثانية كشف الوصولات والفحوصات.</span></div><div id="pvPages">${audHtml(p,a)}</div></div>`;

function audAct(k,b){const {p,a}=audFind();if(!p||!a)return;const done=()=>{touch(p);persist();render();};
  if(k==='start'){audObj(a);done();return;}

  else if(k==='paste'){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="box" style="width:min(820px,100%)"><h3>📋 لصق الوصولات من Excel</h3><p class="hint">انسخ الصفوف من Excel والصقها هنا. ترتيب الأعمدة: رقم الوصل | التاريخ | المجهز | المادة أو العمل | الكمية | الوحدة | السعر | المبلغ (المبلغ الفارغ = الكمية × السعر).</p><textarea rows="12" id="pst" dir="rtl"></textarea><div class="row" style="margin-top:8px"><button class="pri" data-x="ok">إضافة</button><button data-x="no">إلغاء</button></div></div>`;
    document.body.appendChild(d);d.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;if(x.dataset.x==='ok'){let n=0;d.querySelector('#pst').value.split(/\r?\n/).forEach(l=>{const c=l.split('\t');if(c.join('').trim()===''||/رقم الوصل/.test(l))return;
      const qty=c[4]||'',price=num(c[6]),amt=num(c[7])||(num(qty)*price);const item=c[3]||'';
      au.receipts.push({id:uid(),no:(c[0]||'').trim(),date:xDate(/^\d+(\.\d+)?$/.test((c[1]||'').trim())?+c[1]:c[1]),vendor:(c[2]||'').trim(),item:item.trim(),cat:/عمال|اجور|أجور|عامل/.test(item)?'lab':/ايجار|إيجار|استئجار|شفل|حفارة|كرين|بلدوزر|آلية|الية/.test(item)?'mach':/نقل/.test(item)?'trans':'mat',qty:qty.trim(),unit:(c[5]||'').trim(),price,amount:amt,pay:amt>10e6?'صك':'نقد',chq:'',conf:true,offers:false,gov:false,dec:'pend',accAmt:0,note:''});n++;});
      d.remove();flash(`أُضيف ${n} وصل`);done();}else d.remove();});}}

/* ---------- شهادة إنجاز العمل (التنفيذ أمانة) ----------
   على تصميم «محضر وشهادة الاستلام الأولي» في نظام الاستلام بالبرنامج الهندسي (جداول زرقاء، ثلاث صفحات A4، تواقيع ومصادقات)،
   تصدرها لجنة التسلم وفق المادة (2/رابعاً) من تعليمات التنفيذ أمانة: تسلّم العمل خلال 3 أشهر من إنجازه، وإصدار شهادة إنجاز العمل
   وإرسال نسخة الى القسم المالي للتسوية، وإبراء ذمة لجنة التنفيذ من أموال الدولة من تاريخ التسلم. تُحفظ في المشروع: p.cert */
const CERT={pid:'',q:'',st:''};
const CF=[['outNo','العدد (الصادر)'],['outDate','التاريخ','date'],['visitDate','تاريخ زيارة اللجنة','date'],['recvDate','تاريخ التسلم','date'],['location','موقع المشروع'],
  ['labTests','الفحوصات المختبرية','ta'],['brief','شرح موجز عن المشروع والأعمال المنفذة','ta'],['notes','ملاحظات اللجنة','ta'],['deductions','الأعمال غير المنجزة / الحذف والخصومات'],
  ['handover','التسليم للجهة المستفيدة','ta'],['rec','توصيات اللجنة','ta'],['benefRep','مصادقة الجهة المستفيدة (الاسم)'],['divDir','مدير شعبة تنفيذ العمل أمانة (الاسم)'],['engDir','مدير قسم الشؤون الهندسية (الاسم)'],['asstGov','معاون المحافظ للشؤون الفنية (الاسم)'],['deputy','نائب المحافظ للشؤون الفنية (الاسم)']];
function certTotals(p){let adv=0,acc=0,tests=[];(p.advances||[]).forEach(a=>{adv+=advAmt(a);(a.audit&&a.audit.receipts||[]).forEach(r=>{acc+=recAcc(r);});(a.audit&&a.audit.tests||[]).forEach(t=>tests.push(t));});
  const audited=(p.advances||[]).some(a=>a.audit);return {adv,acc,bal:adv-acc,audited,tests};}
function certDefaults(p){const t=certTotals(p),BEN=p.beneficiary||'الجهة المستفيدة';
  const tl=t.tests.length?`قُدِّمت (${t.tests.length}) فحوصات مختبرية: ${t.tests.filter(x=>x.result==='pass').length} مطابقة للمواصفات${t.tests.some(x=>x.result==='fail')?`، و${t.tests.filter(x=>x.result==='fail').length} غير مطابقة`:''} (${[...new Set(t.tests.map(x=>x.name).filter(Boolean))].join('، ')}).`:'';
  return {location:p.district||'',labTests:tl,
    handover:`سُلِّم المشروع الى ${BEN} بكافة مرفقاته وحسب الكشف المصادق والأعمال المنفذة فعلاً.`,
    rec:`توصي اللجنة بتسلم العمل المنفذ بأسلوب التنفيذ أمانة وإصدار شهادة إنجاز العمل وإرسال نسخة منها الى قسم الشؤون المالية لتسوية حساب السلف، وإبراء ذمة لجنة تنفيذ العمل من أموال الدولة اعتباراً من تاريخ التسلم.`};}
function certObj(p){if(!p.cert){const s=DB.records.find(r=>r.id==='am-settings');s.certSerial=(+s.certSerial||0)+1;s.updated=Date.now();p.cert=Object.assign({serial:'AM-'+new Date().getFullYear()+'-'+String(s.certSerial).padStart(4,'0'),status:'draft',outNo:'',outDate:'',visitDate:'',recvDate:'',deductions:'لا يوجد',brief:'',notes:'',benefRep:'',divDir:'',engDir:'',asstGov:'',deputy:''},certDefaults(p));}return p.cert;}
function certFlags(p){const c=p.cert||{},t=certTotals(p),f=[];
  if(!p.doneDate)f.push('أدخل تاريخ الإنجاز في بطاقة المشروع');
  if(p.doneDate&&c.recvDate){const d=(new Date(c.recvDate)-new Date(p.doneDate))/864e5;if(d>S().recvMonths*30.4)f.push(`التسلم بعد ${Math.round(d)} يوماً من الإنجاز — التعليمات: خلال ${S().recvMonths} أشهر (م2/رابعاً/ج)`);if(d<0)f.push('تاريخ التسلم قبل تاريخ الإنجاز');}
  if(!(p.recv||[]).length)f.push('لا توجد أسماء لجنة التسلم');
  if(t.adv&&!t.audited)f.push('لم تُدقَّق سلف المشروع بعد (تبويب «تدقيق السلف»)');
  if(t.audited&&t.bal>0)f.push(`بذمة لجنة التنفيذ ${fm(t.bal)} دينار غير معزَّز — يُسوّى أو يُعاد قبل إبراء الذمة`);
  if(num(p.progress)<100)f.push(`نسبة الإنجاز الفعلي ${pc(p.progress)}`);
  return f;}
function rCert(){const q=nk(CERT.q),ps=P().filter(p=>inYear(p)&&isProj(p)&&(!q||nk(p.name+' '+p.orderNo).includes(q))&&(!CERT.st||(CERT.st==='none'?!p.cert:CERT.st==='done'?['done','recv'].includes(p.status):p.cert&&p.cert.status===CERT.st)))
  .sort((a,b)=>(b.cert?1:0)-(a.cert?1:0)||(['done','recv'].includes(b.status)?1:0)-(['done','recv'].includes(a.status)?1:0)||(b.orderDate||'').localeCompare(a.orderDate||''));
  const all=P().filter(p=>inYear(p)&&isProj(p)),nC=all.filter(p=>p.cert).length,nI=all.filter(p=>p.cert&&p.cert.status==='issued').length,nD=all.filter(p=>['done','recv'].includes(p.status)&&!p.cert).length;
  const p=P().find(x=>x.id===CERT.pid);

   <span class="hint">لجنة التسلم تصدر شهادة إنجاز العمل خلال ${S().recvMonths} أشهر من الإنجاز، وتُرسل نسخة الى القسم المالي للتسوية، وتُبرأ ذمة لجنة التنفيذ من تاريخ التسلم (م2/رابعاً).</span></div>
   <div class="tw" style="max-height:${p?'24vh':'60vh'};margin-top:8px"><table><thead><tr><th class="n">ت</th><th>المشروع</th><th>القضاء</th><th>حالة المشروع</th><th>تاريخ الإنجاز</th><th class="n">الإنجاز</th><th>الشهادة</th></tr></thead><tbody>
   ${ps.slice(0,500).map((x,i)=>`<tr class="clk${x.id===CERT.pid?' flag':''}" data-cert="${x.id}"><td class="n">${i+1}</td><td>${esc(x.name)}<div class="sub">أمر ${esc(x.orderNo)} — ${dmy(x.orderDate)}</div></td><td>${esc(x.district)}</td><td><span class="pill ${STATUS[x.status||'new'][1]}">${STATUS[x.status||'new'][0]}</span></td><td class="n">${dmy(x.doneDate)}</td><td class="n">${pc(x.progress)}</td>
    <td>${x.cert?`<span class="pill ${x.cert.status==='issued'?'p-done':'p-new'}">${x.cert.status==='issued'?'صادرة':'مسودة'}</span> <span class="sub">${esc(x.cert.serial)}</span>`:'<span class="sub">—</span>'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا مشاريع</td></tr>'}</tbody></table></div></div>
  ${p?certEditor(p):''}`;}
function certEditor(p){const c=p.cert;
  if(!c)return `<div class="card"><h4>${esc(p.name)}</h4><p>الحالة: ${STATUS[p.status||'new'][0]} — تاريخ الإنجاز: ${dmy(p.doneDate)||'—'} — الإنجاز الفعلي: ${pc(p.progress)}</p><button class="pri" data-ce="start">🏁 إنشاء شهادة إنجاز العمل</button></div>`;

function parseFill(sh){const f=findCols(sh.rows,['النواقص','المعرّف','خط العرض']);if(!f)return null;const r=f.r,C={};FILL_H.forEach(h=>{C[h]=r.findIndex(c=>c===h);});
  const out=[];for(let i=f.hdr+1;i<sh.rows.length;i++){const x=sh.rows[i]||[],g=h=>C[h]>=0?x[C[h]]:'';const id=hn(g('المعرّف')),no=hn(g('عدد الأمر الإداري'));if(!id&&!no)continue;
    out.push({id,orderNo:no.replace(/\.0$/,''),year:num(g('السنة')),dist:hn(g('القضاء')),ben:hn(g('الجهة المستفيدة')),lat:g('خط العرض'),lng:g('خط الطول'),link:hn(g('رابط الموقع أو الإحداثيات')),start:xDate(g('تاريخ المباشرة')),done:xDate(g('تاريخ الإنجاز')),
      prog:g('نسبة الإنجاز الفعلي %'),st:hn(g('الحالة')),raised:g('المبلغ المرفوع (التراكمي)'),paid:g('المبلغ المصروف (التراكمي)'),recv:hn(g('أسماء لجنة التسلم')),note:hn(g('ملاحظات اللجنة'))});}
  return out;}
function applyFill(list){const st={upd:0,ll:0,prog:0,dates:0,ben:0,adv:0,low:0,miss:0,recv:0,notes:0,none:0},has=v=>v!==''&&v!=null,key=(y,n)=>y+'|'+String(n).replace(/\D/g,'');
  const byId=new Map(P().map(p=>[p.id,p])),byKey=new Map(P().filter(p=>p.orderNo&&isProj(p)).map(p=>[key(yearOf(p),p.orderNo),p]));
  list.forEach(it=>{let p=(it.id&&byId.get(it.id))||(it.orderNo&&byKey.get(key(it.year,it.orderNo)));if(!p){st.none++;return;}if(p.dupOf)p=byId.get(p.dupOf)||p;const b0=JSON.stringify(p);
    if(it.dist&&fixDist(it.dist)!==p.district){p.district=fixDist(it.dist);st.ben++;}
    if(it.ben&&it.ben!==benOf(p)){p.beneficiary=it.ben;st.ben++;}
    let lat=num(it.lat),lng=num(it.lng);if(!(lat&&lng)&&it.link){const ll=parseLL(it.link);if(ll){lat=ll.lat;lng=ll.lng;}}
    if(lat&&lng&&(String(lat)!==String(p.lat)||String(lng)!==String(p.lng))){p.lat=lat;p.lng=lng;st.ll++;}
    if(it.start&&it.start!==p.startDate){p.startDate=it.start;st.dates++;}if(it.done&&it.done!==p.doneDate){p.doneDate=it.done;st.dates++;}
    if(has(it.prog)){const v=Math.max(0,Math.min(100,num(it.prog)));if(v!==num(p.progress)){p.progress=v;st.prog++;}}
    /* الحالة: تُؤخذ إن غيّرتها اللجنة؛ وإن بقيت كما هي تتبع نسبة الإنجاز (أكثر من صفر = قيد التنفيذ، 100 = منجز) */
    if(it.st&&STATUS_BY_LABEL[it.st]&&STATUS_BY_LABEL[it.st]!==(p.status||'new'))p.status=STATUS_BY_LABEL[it.st];else if(num(p.progress)>=100&&['new','run'].includes(p.status||'new'))p.status='done';else if(num(p.progress)>0&&(p.status||'new')==='new')p.status='run';
    if(it.recv&&it.recv!==(p.recv||[]).join(' / ')){p.recv=splitMembers(it.recv);st.recv++;}
    if(it.note&&!(p.notes||'').includes(it.note)){p.notes=[p.notes,'ملاحظات اللجنة: '+it.note].filter(Boolean).join(' — ');st.notes++;}
    const R=num(it.raised),Pd=num(it.paid),c=calc(p);p.advances=p.advances||[];
    if((R||Pd)&&!c.n){p.advances.push({id:uid(),no:'1',date:'',raised:R||Pd,paid:Pd,cheque:'',note:'من استمارة إكمال النواقص'});st.adv++;}
    else if((R||Pd)&&(Math.round(R)>Math.round(c.raised)||Math.round(Pd)>Math.round(c.paid))){p.advances.push({id:uid(),no:String(c.n+1),date:today(),raised:Math.max(0,R-c.raised),paid:Math.max(0,Pd-c.paid),cheque:'',note:'فرق التراكمي من استمارة إكمال النواقص'});st.adv++;}
    else if((R||Pd)&&(Math.round(R)<Math.round(c.raised)||Math.round(Pd)<Math.round(c.paid)))st.low++;
    if(JSON.stringify(p)!==b0){p.updated=Date.now();st.upd++;}if(missingOf(p).length)st.miss++;});
  return st;}
