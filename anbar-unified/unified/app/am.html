<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشاريع التنفيذ أمانة</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#f1efe9;color:#1f2430;font:14px/1.6 Tahoma,'Segoe UI',Arial,sans-serif;direction:rtl}
#bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;background:#7a4e12;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#bar b{font-size:15px}
#bar select{background:#fff}
#bar .st{margin-inline-start:auto;font-size:12px;opacity:.9}
nav#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 14px 0;background:#e8e2d6;border-bottom:1px solid #d6cdbb;position:sticky;top:44px;z-index:25}
nav#tabs button{border:1px solid #d6cdbb;border-bottom:none;border-radius:7px 7px 0 0;background:#f6f2ea;color:#5b3a0c;padding:6px 14px;font-weight:700}
nav#tabs button.on{background:#fff;color:#7a4e12;box-shadow:0 -2px 0 #7a4e12 inset}
button{font:inherit;cursor:pointer;border-radius:5px;border:1px solid #7a4e12;background:#fff;color:#7a4e12;padding:4px 12px}
#bar button{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.5)}
button.pri{background:#7a4e12;color:#fff}
button.sm{padding:1px 8px;font-size:12px}
button.dng{color:#b42318;border-color:#b42318}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid #c2b9a7;border-radius:5px;padding:4px 8px;background:#fff;min-width:0}
textarea{width:100%;resize:vertical}
main{padding:12px 14px 40px;max-width:1600px;margin:0 auto}
.card{background:#fff;border:1px solid #ddd3c1;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card h4{margin:0 0 8px;color:#6a430f;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid #ddd3c1;border-radius:8px;padding:10px 14px}
.kpi b{display:block;font-size:clamp(16px,1.6vw,21px);line-height:1.3;color:#6a430f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.kpi span{font-size:12px;color:#6b6457}
.kpi.bad b{color:#b42318}.kpi.bad{border-color:#e9b1aa;background:#fff7f6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.tw{overflow:auto;border:1px solid #ddd3c1;border-radius:6px;background:#fff;max-height:70vh}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid #ece6da;text-align:right;vertical-align:top}
th{background:#efe7d8;position:sticky;top:0;white-space:nowrap;z-index:1}
tfoot td{background:#f6f0e4;font-weight:700;position:sticky;bottom:0}
td.n,th.n{text-align:center}
td.m{white-space:nowrap;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer}tr.clk:hover td{background:#fbf6ec}
tr.flag td{background:#fff3f1}
.sub{font-size:12px;color:#6b6457}
.pill{display:inline-block;padding:0 9px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;background:#8a7f6b}
.p-run{background:#2563a8}.p-done{background:#1f7a3d}.p-recv{background:#0f766e}.p-stop{background:#b42318}.p-new{background:#8a7f6b}.p-add{background:#7c3aed}
.bad{color:#b42318;font-weight:700}.ok{color:#1f7a3d}.warn{color:#a15c00;font-weight:700}
.bars .hb{display:grid;grid-template-columns:150px 1fr 120px;gap:8px;align-items:center;margin:3px 0;font-size:13px}
.bars .t{height:12px;background:#f1ebe0;border-radius:3px;position:relative;overflow:hidden}
.bars .t i{position:absolute;inset:0 auto 0 0;background:#c8a56a}.bars .t u{position:absolute;inset:0 auto 0 0;background:#7a4e12;text-decoration:none}
.empty{padding:26px;text-align:center;color:#6b6457}
#msg{position:fixed;bottom:14px;left:14px;z-index:99;background:#1f2430;color:#fff;padding:8px 14px;border-radius:7px;display:none;max-width:60vw}
#msg.err{background:#b42318}
.modal{position:fixed;inset:0;background:rgba(20,16,8,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px}
.modal .box{background:#fff;border-radius:10px;width:min(1150px,100%);padding:14px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 10px;color:#6a430f}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 12px}
.fg label{display:flex;flex-direction:column;font-size:12px;color:#5b5446;gap:2px}
.fg label.w2{grid-column:span 2}.fg label.w3{grid-column:1/-1}
.mem{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mem span{font-size:12px;border:1px solid #ddd3c1;border-radius:10px;padding:0 8px;background:#faf7f1}
.mem span.x{border-color:#b42318;color:#b42318;background:#fff3f1;font-weight:700}
.adv td input{width:100%}
svg.map{width:100%;height:auto;background:#eef3f6;border:1px solid #ddd3c1;border-radius:8px}
svg.map .d{fill:#fbf7ef;stroke:#9c8c6c;stroke-width:.6}
svg.map .d:hover{fill:#f2e6cc}
svg.map text{font:bold 17px Tahoma;fill:#6a430f;paint-order:stroke;stroke:#fff;stroke-width:2.5px;pointer-events:none}
svg.map circle{stroke:#fff;stroke-width:.8;cursor:pointer}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-inline-end:12px;font-size:12px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.doc{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:18mm 18mm 16mm;font:15pt/1.7 'Simplified Arabic','Traditional Arabic',Tahoma,serif;color:#000;border:1px solid #ccc}
.doc .hd{display:flex;justify-content:space-between;font-weight:700;font-size:13pt;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
.doc .ttl{text-align:center;font-weight:700;font-size:17pt;margin:6px 0}
.doc table{border-collapse:collapse;width:100%;margin:6px 0;font-size:13pt}.doc table th,.doc table td{border:1px solid #000;padding:2px 6px;text-align:center;position:static;background:none}
.doc table th{background:#d9d9d9}
.doc .sg{margin-top:28px;margin-inline-start:55%;text-align:center;font-weight:700}
.doc .cc{margin-top:20px;font-size:12pt}.doc .cc ul{margin:2px 0;padding-inline-start:22px}
.doc p{margin:0 0 4px;text-align:justify;white-space:pre-wrap}
@media print{body{background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:block!important}#printArea .doc{border:none;padding:0;width:auto;min-height:0}@page{size:A4;margin:16mm}}
#printArea{display:none}
.chips button{margin:2px}
.hint{color:#6b6457;font-size:12.5px}
details summary{cursor:pointer;font-weight:700;color:#6a430f}
</style>
</head>
<body>
<div id="bar">
  <b>🏗️ مشاريع التنفيذ أمانة — لجان التنفيذ والتسلم</b>
  <label>السنة: <select id="fYear"></select></label>
  <button id="bNew">＋ مشروع جديد</button>
  <button id="bImport" title="استيراد سجل الأوامر الإدارية (الصادر 2024/2025/2026) وملف التخصيصات (Projects) — يمكن اختيار الملفين معاً">📥 استيراد Excel</button>
  <button id="bExport" title="الموقف بالإكسل: الإحداثيات والمبلغ المرفوع والمصروف ونسبة الإنجاز الفعلي، مع الأقضية والقطاعات والمهندسين والسلف">📤 الموقف بالإكسل</button>
  <span class="st" id="stInfo"></span>
</div>
<nav id="tabs">
  <button data-t="dash" class="on">📊 لوحة المعلومات</button>
  <button data-t="proj">📁 المشاريع</button>
  <button data-t="eng">👷 المهندسون واللجان</button>
  <button data-t="adv">💰 السلف المصروفة</button>
  <button data-t="map">🗺️ الخريطة والإحداثيات</button>
  <button data-t="let">✉️ المخاطبات</button>
  <button data-t="set">⚙ الإعدادات والبيانات</button>
</nav>
<main id="main"></main>
<input type="file" id="fileIn" accept=".xlsx,.xlsm" multiple hidden>
<input type="file" id="jsonIn" accept=".json" hidden>
<div id="msg"></div>
<div id="printArea"></div>
<script src="../shell/xlwriter.js"></script>
<script src="../shell/anbar-geo.js"></script>
<script>
'use strict';
/* ===================== نظام «مشاريع التنفيذ أمانة» =====================
   مشاريع تُنفَّذ بلجان تنفيذ ولجان تسلّم (لا شركات) وفق تعليمات تنفيذ الأعمال بأسلوب التنفيذ أمانة رقم (1) لسنة 2018 المعدلة بالتعليمات رقم (3) لسنة 2022.
   السجلات: {records:[...]} — مشروع type:'p'، الإعدادات id:'am-settings' type:'s'. كل سجل يحمل id وupdated (للمزامنة بين الحاسبات).
   يعمل داخل البرنامج الموحد (window.desktop) أو وحده في المتصفح (حفظ على الجهاز + نسخة JSON). */
const DESK=window.desktop||null;
const LSK='anbar_amana_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>{if(v==null||v==='')return 0;if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,،\s]/g,''));return isFinite(n)?n:0;};
const fm=v=>Math.round(num(v)).toLocaleString('en-US');
const pc=v=>(Math.round(num(v)*10)/10).toLocaleString('en-US')+'%';
const dmy=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?`${+m[3]}/${+m[2]}/${m[1]}`:'';};
const today=()=>new Date().toISOString().slice(0,10);
const STATUS={new:['لم يباشر','p-new'],run:['قيد التنفيذ','p-run'],done:['منجز','p-done'],recv:['مستلم (صدرت شهادة الإنجاز)','p-recv'],stop:['متوقف / متلكئ','p-stop']};
const DEF_SET={id:'am-settings',type:'s',maxCom:3,ceiling:500000000,advMax:100000000,recvMonths:3,
  memoTo:'السيد نائب المحافظ للشؤون الفنية المحترم',orderSign:{hon:'المهندس',name:'عمر مشعان دبوس',title:'محافظ الأنبار'},memoSign:{hon:'المهندس',name:'',title:'مدير قسم الشؤون الهندسية'},
  sectors:[]};
let DB={version:1,records:[]};
let TAB='dash',YEAR='all',F={q:'',dist:'',sector:'',status:'',flag:false,kind:'p'},ENG={only:true,over:false,q:''};

/* ---------- الحفظ والتحميل ---------- */
function load(){let t=null;try{t=DESK?DESK.load():localStorage.getItem(LSK);}catch(_){}
  try{const o=t?JSON.parse(t):null;if(o&&Array.isArray(o.records))DB=o;}catch(_){}
  if(!DB.records.find(r=>r.id==='am-settings'))DB.records.push(Object.assign({updated:1},JSON.parse(JSON.stringify(DEF_SET))));}
let saveT=0;
function persist(now){clearTimeout(saveT);const go=()=>{const t=JSON.stringify(DB);try{if(DESK)DESK.save(t);else localStorage.setItem(LSK,t);}catch(e){flash('تعذّر الحفظ: '+(e&&e.message||e),true);}info();};if(now)go();else saveT=setTimeout(go,350);}
window.addEventListener('beforeunload',()=>{if(saveT){clearTimeout(saveT);const t=JSON.stringify(DB);try{if(DESK&&DESK.saveSync)DESK.saveSync(t);else if(!DESK)localStorage.setItem(LSK,t);}catch(_){}}});
window.__syncReload=()=>{load();render();};
const S=()=>Object.assign({},DEF_SET,DB.records.find(r=>r.id==='am-settings')||{});
function setS(patch){const s=DB.records.find(r=>r.id==='am-settings');Object.assign(s,patch,{updated:Date.now()});persist();}
const P=()=>DB.records.filter(r=>r&&r.type==='p');
const touch=p=>{p.updated=Date.now();};
function flash(t,err){const m=$('#msg');m.textContent=t;m.className=err?'err':'';m.style.display='block';clearTimeout(flash.t);flash.t=setTimeout(()=>{m.style.display='none';},err?6000:2600);}
function info(){const ps=P();$('#stInfo').textContent=`${ps.length} سجل — ${DESK?'محفوظ في ملف بيانات البرنامج':'محفوظ على هذا الجهاز (صدّر نسخة JSON احتياطية)'}`;}

/* ---------- الأسماء والقضاء ---------- */
const DIST_FIX=[[/^(ال)?فلوج[هة]$|^الفوج[هة]$/,'الفلوجة'],[/^(ال)?رطب[هة]$/,'الرطبة'],[/^عن[هة]$/,'عنه'],[/^(ال)?بغداد?ي$/,'البغدادي'],[/^(ال)?عامري[هة]( الصمود)?$/,'العامرية'],[/^را[وو]?[هة]$/,'راوه'],[/^(ال)?قائم$/,'القائم'],[/^(ال)?رمادي$/,'الرمادي'],[/^حديث[هة]$/,'حديثة'],[/^(ال)?خالدي[هة]$/,'الخالدية'],[/^(ال)?حباني[هة]$/,'الحبانية'],[/^(ال)?كرم[هة]$/,'الكرمة'],[/^هيت$/,'هيت'],[/^(ال)?نخيب$/,'النخيب'],[/^(ال)?صقلاوي[هة]$/,'الصقلاوية']];
function fixDist(s){s=String(s||'').replace(/\s+/g,' ').trim();if(!s)return '';for(const [re,v] of DIST_FIX)if(re.test(s))return v;return s;}
/* القضاء من القطاع: «الرمادي 8» ← الرمادي */
const distOfSector=s=>fixDist(String(s||'').replace(/[\d٠-٩]+/g,'').trim());
const nk=s=>String(s||'').replace(/[ً-ٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/عبد\s+/g,'عبد').replace(/[^؀-ۿA-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const PFX=/^(المهندس(?:ة)?|م\s*[.\/]|السيد(?:ة)?|الفني(?:ة)?|ر\s*\.?\s*مهندس)[\s.]*/;
/* أعضاء اللجنة من خلية واحدة: أسطر، أو مسافات كثيرة بين اسمين، أو «/»، أو تكرار البادئة (م. / السيد / الفني) */
function splitMembers(s){s=String(s||'').replace(/\r/g,'\n').replace(/(السيدة|السيد|الفنية|الفني)(?=[\u0621-\u064A.])/g,'$1 ').replace(/م\s*\.\s*السيد(ة?)/g,'السيد$1').replace(/(الفنية|الفني|السيدة|السيد|المهندسة|المهندس)\s*\/\s*/g,'$1 ').replace(/(^|[\s\/])م\s*\/\s*/g,'$1م.');
  s=s.replace(/(^|[^؀-ۿ])(م\s*\.|المهندسة?\s|السيدة?\s|الفنية?\s)/g,'$1\n$2');
  return s.split(/\n|\/|\s{4,}|،|,/).map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&nk(x.replace(PFX,'')).length>2);}
function memberInfo(raw){const m=PFX.exec(raw),p=m?m[1].replace(/\s/g,''):'';const name=raw.replace(PFX,'').trim();
  const role=/^م[.\/]$|^المهندس|مهندس/.test(p)?'eng':/^الفني/.test(p)?'tech':/^السيد/.test(p)?'staff':'';return {raw,name,key:nk(name),role};}
const yearOf=p=>+p.year||(p.orderDate?+p.orderDate.slice(0,4):0);
const isProj=p=>p.kind!=='add';

/* ---------- الحسابات ---------- */
function calc(p){const adv=Array.isArray(p.advances)?p.advances:[];const raised=adv.reduce((a,x)=>a+num(x.raised),0),paid=adv.reduce((a,x)=>a+num(x.paid),0),amt=num(p.amount);
  return {raised,paid,amt,rem:amt-paid,fin:amt?paid/amt*100:0,n:adv.length,prog:num(p.progress)};}
/* عدد لجان التنفيذ لكل شخص في كل سنة (المادة 1/رابعاً/أ: لا يجوز اشتراك الموظف بأكثر من 3 لجان) */
function people(){const map=new Map();
  for(const p of P()){if(!isProj(p))continue;const y=yearOf(p);
    for(const [k,list] of [['exec',p.exec],['recv',p.recv]])(list||[]).forEach(raw=>{const mi=memberInfo(raw);if(!mi.key)return;
      let e=map.get(mi.key);if(!e){e={key:mi.key,name:mi.name,role:mi.role,years:{}};map.set(mi.key,e);}if(!e.role&&mi.role)e.role=mi.role;if(mi.role==='eng')e.role='eng';
      const Y=e.years[y]=e.years[y]||{exec:[],recv:[]};Y[k].push(p.id);});}
  return map;}
function overSet(map){const mx=S().maxCom,out=new Set();for(const e of map.values())for(const y in e.years)if(e.years[y].exec.length>mx)out.add(e.key+'|'+y);return out;}
function projFlags(p,ov){const s=S(),c=calc(p),f=[],y=yearOf(p);
  if(c.amt>s.ceiling)f.push('المبلغ يتجاوز سقف التنفيذ أمانة ('+fm(s.ceiling)+')');
  (p.advances||[]).forEach(a=>{if(num(a.paid||a.raised)>s.advMax)f.push(`السلفة ${a.no||''} تتجاوز ${fm(s.advMax)} للسلفة الواحدة`);});
  if(c.amt&&c.paid>c.amt)f.push('المصروف أكبر من مبلغ الأمر الإداري');
  if(c.amt&&c.raised>c.amt)f.push('المرفوع أكبر من مبلغ الأمر الإداري');
  if(ov)(p.exec||[]).forEach(raw=>{const k=memberInfo(raw).key;if(ov.has(k+'|'+y))f.push(`«${memberInfo(raw).name}» في أكثر من ${s.maxCom} لجان تنفيذ لعام ${y}`);});
  if(!p.exec||!p.exec.length)f.push('لا توجد أسماء لجنة التنفيذ');
  if(p.status==='done'&&p.doneDate&&!p.recvDate){const d=(Date.now()-new Date(p.doneDate))/864e5;if(d>s.recvMonths*30.4)f.push('مضى أكثر من 3 أشهر على الإنجاز ولم يُسجَّل التسلم');}
  return f;}
const inYear=p=>YEAR==='all'||String(yearOf(p))===String(YEAR);
function years(){const s=new Set(P().map(yearOf).filter(Boolean));[2024,2025,2026].forEach(y=>s.add(y));return [...s].sort();}

/* ---------- التفقيط (المبلغ كتابةً) ---------- */
function tafqit(n){n=Math.round(num(n));if(!n)return 'صفر';
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],hund=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const tri=x=>{const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(hund[h]);if(r){if(r<20)p.push(ones[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?ones[o]+' و'+tens[t]:tens[t]);}}return p.join(' و');};
  const sc=[['','',''],['ألف','ألفان','آلاف'],['مليون','مليونان','ملايين'],['مليار','ملياران','مليارات']];const parts=[];let i=0;
  while(n>0&&i<4){const g=n%1000;if(g){let w;if(i===0)w=tri(g);else if(g===1)w=sc[i][0];else if(g===2)w=sc[i][1];else if(g>=3&&g<=10)w=tri(g)+' '+sc[i][2];else w=tri(g)+' '+sc[i][0];parts.unshift(w);}n=Math.floor(n/1000);i++;}
  return parts.join(' و');}

/* ---------- العرض ---------- */
function render(){const ys=years();$('#fYear').innerHTML=`<option value="all">كل السنوات</option>`+ys.map(y=>`<option${String(y)===String(YEAR)?' selected':''}>${y}</option>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  const fn={dash:rDash,proj:rProj,eng:rEng,adv:rAdv,map:rMap,let:rLet,set:rSet}[TAB];$('#main').innerHTML=fn();info();}
function groupBy(list,keyf){const m=new Map();list.forEach(p=>{const k=keyf(p)||'غير محدد';const c=calc(p);const g=m.get(k)||{k,n:0,amt:0,raised:0,paid:0,prog:0,eng:new Set()};g.n++;g.amt+=c.amt;g.raised+=c.raised;g.paid+=c.paid;g.prog+=c.prog;

function buildDoc(p,kind){const s=S(),c=calc(p),B='…………',P_=p.name||B,amt=c.amt?`(${fm(c.amt)}) دينار (${tafqit(c.amt)} دينار)`:B,D=p.district||B,BEN=p.beneficiary||B;

   <p>مشاريع جديدة: <b>${add}</b> — سلف من ملف التخصيصات: <b>${adv}</b> — مشاريع حُدِّد قطاعها: <b>${sec}</b></p><p class="hint">الربط بين الملفين برقم الأمر الإداري (عدد الصادر = رقم الصادر) وسنته. إعادة الاستيراد تحدّث الأسماء والمبالغ والسلف المستوردة، ولا تمسّ الإحداثيات ونسب الإنجاز والسلف المضافة يدوياً.</p><button class="pri" data-x="1">موافق</button></div>`;
  document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target.closest('[data-x]'))d.remove();});}

/* ---------- Excel: الموقف ---------- */
function saveFile(name,bytes){if(DESK&&DESK.saveFile)return DESK.saveFile(name,bytes).then(r=>{if(r==='ok')flash('تم الحفظ: '+name);else if(r==='error')flash('تعذّر الحفظ',true);});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes]));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);return Promise.resolve();}
function exportXlsx(){if(!window.XLW)return flash('كاتب Excel غير متاح (ملف shell/xlwriter.js)',true);const X=XLW.S,T=v=>({v:v==null?'':String(v),s:X.txt}),I=v=>({v:Math.round(num(v)),s:X.int}),Pp=v=>({v:Math.round(num(v)*10)/10,s:X.pct}),H=v=>({v,s:X.head}),W=v=>({v:v==null?'':String(v),s:X.wrap});
  const ttl=YEAR==='all'?'كل السنوات':'لعام '+YEAR,pm=people(),ov=overSet(pm),ps=P().filter(p=>inYear(p)&&isProj(p)).sort((a,b)=>yearOf(a)-yearOf(b)||(a.orderDate||'').localeCompare(b.orderDate||''));
  const hd=['ت','السنة','عدد الأمر الإداري','تاريخه','اسم المشروع','القضاء','القطاع','الجهة المستفيدة','مبلغ الأمر الإداري','المبلغ المرفوع','المبلغ المصروف','المتبقي','نسبة الصرف %','نسبة الإنجاز الفعلي %','خط العرض','خط الطول','رابط الموقع','الحالة','عدد السلف','لجنة التنفيذ','لجنة التسلم','ملاحظات'];
  const L=XLW.colL(hd.length-1);let t={a:0,r:0,p:0};
  const rows=[[{v:'موقف مشاريع التنفيذ أمانة — '+ttl,s:X.title}],[{v:'قسم الشؤون الهندسية — محافظة الأنبار — '+dmy(today()),s:X.sub}],[],hd.map(H)];
  ps.forEach((p,i)=>{const c=calc(p);t.a+=c.amt;t.r+=c.raised;t.p+=c.paid;rows.push([I(i+1),I(yearOf(p)),T(p.orderNo),T(dmy(p.orderDate)),W(p.name),T(p.district),T(p.sector),T(p.beneficiary),I(c.amt),I(c.raised),I(c.paid),I(c.rem),Pp(c.fin),Pp(c.prog),
    p.lat?{v:+p.lat,s:X.num1}:T(''),p.lng?{v:+p.lng,s:X.num1}:T(''),T(p.lat&&p.lng?gmaps(p):''),T(STATUS[p.status||'new'][0]),I(c.n),W((p.exec||[]).join(' / ')),W((p.recv||[]).join(' / ')),W([p.notes,...projFlags(p,ov)].filter(Boolean).join(' — '))]);});
  rows.push([{v:'المجموع',s:X.gtT},null,null,null,null,null,null,null,{v:t.a,s:X.gtI},{v:t.r,s:X.gtI},{v:t.p,s:X.gtI},{v:t.a-t.p,s:X.gtI},{v:t.a?Math.round(t.p/t.a*1000)/10:0,s:X.gtP}]);
  const grp=(name,list,label)=>{const r=[[{v:name+' — '+ttl,s:X.title}],[],[label,'عدد المشاريع','مبلغ الأوامر الإدارية','المبلغ المرفوع','المبلغ المصروف','المتبقي','نسبة الصرف %','معدل الإنجاز الفعلي %','مهندسو التنفيذ'].map(H)];let s={n:0,a:0,r:0,p:0};
    list.forEach(g=>{s.n+=g.n;s.a+=g.amt;s.r+=g.raised;s.p+=g.paid;r.push([T(g.k),I(g.n),I(g.amt),I(g.raised),I(g.paid),I(g.amt-g.paid),Pp(g.amt?g.paid/g.amt*100:0),Pp(g.n?g.prog/g.n:0),I(g.eng.size)]);});
    r.push([{v:'المجموع',s:X.gtT},{v:s.n,s:X.gtI},{v:s.a,s:X.gtI},{v:s.r,s:X.gtI},{v:s.p,s:X.gtI},{v:s.a-s.p,s:X.gtI},{v:s.a?Math.round(s.p/s.a*1000)/10:0,s:X.gtP}]);
    return {name,cols:[22,12,18,18,18,18,12,14,12],rows:r,merges:['A1:I1'],freeze:3,titles:3};};
  const mx=S().maxCom,ys=YEAR==='all'?years().map(String):[String(YEAR)],er=[[{v:'المهندسون في لجان التنفيذ والتسلم — '+ttl,s:X.title}],[{v:`المؤشَّر: مضاف في لجان التنفيذ أكثر من ${mx} مرات في السنة الواحدة (المادة 1/رابعاً/أ)`,s:X.sub}],['الاسم','الصفة','السنة','لجان التنفيذ','لجان التسلم','تجاوز','مشاريع التنفيذ'].map(H)];
  const byId=new Map(P().map(p=>[p.id,p]));[...pm.values()].forEach(e=>ys.forEach(y=>{const Y=e.years[y];if(!Y)return;er.push([T(e.name),T({eng:'مهندس',tech:'فني',staff:'موظف'}[e.role]||''),T(y),I(Y.exec.length),I(Y.recv.length),Y.exec.length>mx?{v:'⚠ أكثر من '+mx,s:X.dev}:T(''),W(Y.exec.map(id=>(byId.get(id)||{}).name||'').join(' / '))]);}));
  er.splice(3,er.length,...er.slice(3).sort((a,b)=>b[3].v-a[3].v));
  const ar=[[{v:'السلف المصروفة لكل مشروع — '+ttl,s:X.title}],[],['المشروع','عدد الأمر','القضاء','القطاع','رقم السلفة','التاريخ','المبلغ المرفوع','المبلغ المصروف','رقم الصك','ملاحظات'].map(H)];
  P().filter(inYear).forEach(p=>(p.advances||[]).forEach(a=>ar.push([W(p.name),T(p.orderNo),T(p.district),T(p.sector),T(a.no),T(dmy(a.date)),I(a.raised),I(a.paid),T(a.cheque),T(a.note)])));
  const buf=XLW.book([{name:'الموقف',cols:[5,7,10,11,46,12,12,20,16,16,16,16,10,11,11,11,30,12,7,40,40,34],rows,merges:[`A1:${L}1`,`A2:${L}2`],freeze:4,titles:4,filter:`A4:${L}4`,heights:{1:30,4:30},zoom:90},
    grp('حسب القضاء',groupBy(ps,p=>p.district),'القضاء'),grp('حسب القطاع',groupBy(ps,p=>p.sector),'القطاع'),
    {name:'المهندسون',cols:[30,10,8,12,12,14,90],rows:er,merges:['A1:G1','A2:G2'],freeze:3,titles:3,filter:`A3:G3`},{name:'السلف',cols:[46,10,12,12,9,11,16,16,14,34],rows:ar,merges:['A1:J1'],freeze:3,titles:3,filter:'A3:J3'}],{title:'موقف مشاريع التنفيذ أمانة',author:'قسم الشؤون الهندسية — محافظة الأنبار'});
  saveFile(`موقف-مشاريع-التنفيذ-أمانة_${YEAR==='all'?'كل-السنوات':YEAR}_${today()}.xlsx`,buf);}

/* ---------- الإعدادات ---------- */
function rSet(){const s=S();return `<div class="grid2"><div class="card"><h4>الحدود (تعليمات التنفيذ أمانة 1/2018 المعدلة 3/2022)</h4><div class="fg">
  <label>أقصى عدد لجان تنفيذ للشخص في السنة<input type="number" data-s="maxCom" value="${s.maxCom}"></label>
  <label>سقف العمل أمانة (دينار)<input data-s="ceiling" value="${fm(s.ceiling)}"></label>
  <label>حد السلفة الواحدة (دينار)<input data-s="advMax" value="${fm(s.advMax)}"></label>
  <label>مدة التسلم بعد الإنجاز (أشهر)<input type="number" data-s="recvMonths" value="${s.recvMonths}"></label></div></div>
  <div class="card"><h4>المخاطبات</h4><div class="fg"><label class="w3">المطالعة إلى<input data-s="memoTo" value="${esc(s.memoTo)}"></label>
  <label>موقّع المطالعة: اللقب<input data-ss="memoSign.hon" value="${esc(s.memoSign.hon)}"></label><label>الاسم<input data-ss="memoSign.name" value="${esc(s.memoSign.name)}"></label><label>المنصب<input data-ss="memoSign.title" value="${esc(s.memoSign.title)}"></label>
  <label>موقّع الأمر الإداري: اللقب<input data-ss="orderSign.hon" value="${esc(s.orderSign.hon)}"></label><label>الاسم<input data-ss="orderSign.name" value="${esc(s.orderSign.name)}"></label><label>المنصب<input data-ss="orderSign.title" value="${esc(s.orderSign.title)}"></label></div></div>
  <div class="card"><h4>البيانات</h4><p class="hint">${DESK?'البيانات في ملف «AmanaProjects-Data.json» في مجلد بيانات البرنامج، وتُزامَن وتُنسخ احتياطياً مع باقي الأنظمة.':'البيانات محفوظة في متصفح هذا الجهاز فقط — احفظ نسخة JSON دورياً.'}</p>
  <div class="row"><button data-a="jsonOut">⬇ نسخة JSON</button><button data-a="jsonIn">⬆ استعادة من JSON</button><button data-a="import">📥 استيراد Excel</button><button class="dng" data-a="wipe">🗑 حذف كل المشاريع</button></div></div></div>`;}

/* ---------- الأحداث ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){TAB=b.dataset.t;render();}});
$('#fYear').addEventListener('change',e=>{YEAR=e.target.value;render();});
$('#bNew').onclick=()=>openProj('');$('#bImport').onclick=()=>$('#fileIn').click();$('#bExport').onclick=exportXlsx;
$('#fileIn').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f);});
$('#jsonIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.records))throw new Error('ملف غير صالح');if(!confirm(`استعادة ${o.records.length} سجل؟ تُستبدل البيانات الحالية.`))return;DB=o;persist(true);load();render();flash('تمت الاستعادة');}catch(err){flash(String(err.message||err),true);}});
$('#main').addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o&&o.dataset.open){e.preventDefault();openProj(o.dataset.open);return;}
  const a=e.target.closest('[data-a]');if(a){const k=a.dataset.a;
    if(k==='import')$('#fileIn').click();else if(k==='new')openProj('');else if(k==='goOver'){TAB='eng';ENG.over=true;render();}
    else if(k==='jsonOut')saveFile(`AmanaProjects-نسخة_${today()}.json`,new TextEncoder().encode(JSON.stringify(DB,null,1)));else if(k==='jsonIn')$('#jsonIn').click();
    else if(k==='wipe'){if(!confirm('حذف كل المشاريع؟ لا يمكن التراجع.'))return;P().forEach(p=>{try{DESK&&DESK.tomb&&DESK.tomb(p.id);}catch(_){}});DB.records=DB.records.filter(r=>r.type!=='p');persist(true);render();}return;}
  const lp=e.target.closest('[data-lp]');if(lp){LET.pid=lp.dataset.lp;render();return;}const l=e.target.closest('[data-l]');if(l)letAct(l.dataset.l);});
let qT=0;$('#main').addEventListener('input',e=>{const id=e.target.id;
  if(['fq','eq','lq'].includes(id)){clearTimeout(qT);qT=setTimeout(()=>{if(id==='fq')F.q=e.target.value;else if(id==='eq')ENG.q=e.target.value;else LET.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);}
  const sk=e.target.dataset.s,ss=e.target.dataset.ss;if(sk){setS({[sk]:['memoTo'].includes(sk)?e.target.value:num(e.target.value)});}if(ss){const [a,b]=ss.split('.');const cur=Object.assign({},S()[a]);cur[b]=e.target.value;setS({[a]:cur});}});
$('#main').addEventListener('change',e=>{const id=e.target.id;if(id==='fDist')F.dist=e.target.value;else if(id==='fSector')F.sector=e.target.value;else if(id==='fStatus')F.status=e.target.value;else if(id==='fKind')F.kind=e.target.value;else if(id==='fFlag')F.flag=e.target.checked;
  else if(id==='eOnly')ENG.only=e.target.checked;else if(id==='eOver')ENG.over=e.target.checked;else if(e.target.name==='lk'){LET.kind=e.target.value;return;}else return;render();});
$('#main').addEventListener('keydown',e=>{const t=e.target;if(t.dataset&&t.dataset.ll&&e.key==='Enter'){const ll=parseLL(t.value);if(!ll)return flash('صيغة الإحداثيات غير مفهومة',true);const p=P().find(x=>x.id===t.dataset.ll);if(p){p.lat=ll.lat;p.lng=ll.lng;touch(p);persist();render();flash('حُفظت الإحداثيات');}}});
/* من نظام آخر: فتح مشروع برقم أمره الإداري */
window.__openProject=a=>{const p=P().find(x=>String(x.orderNo)===String(a)||x.id===a);if(p){openProj(p.id);return true;}return false;};
load();render();
</script>
