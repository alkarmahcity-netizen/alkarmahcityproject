<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفحة كبار الشخصيات للاطلاع — محافظة الأنبار</title>
<style>
:root{--g:#1f5f36;--g2:#2f8a45;--bg:#eef2ee;--card:#fff;--ink:#1d2a22;--mut:#6b7a72;--line:#dde6e0;--ok:#2f8a45;--bad:#c0392b;--warn:#d19a1a;--warn2:#c2570c;--blue:#2563a8;--none:#8a968f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:17px;margin:0;line-height:1.3}header small{display:block;font-size:11.5px;opacity:.85;font-weight:400}
header .sp{flex:1}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
.upd{font-size:11.5px;text-align:center;color:var(--mut);padding:6px 12px 0}.upd.bad{color:var(--bad);font-weight:600}
main{padding:10px 12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.k{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.k span{display:block;font-size:12px;color:var(--mut)}.k b{display:block;font-size:20px;margin-top:2px}.k small{font-size:11.5px;color:var(--mut)}
.k.wide{grid-column:1/-1}
.stb{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:8px 0 6px;background:#e6ece8}.stb i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}.lg span{display:inline-flex;align-items:center;gap:4px}.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.flt{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.flt input,.flt select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.row2{display:flex;gap:6px}.row2>*{flex:1;min-width:0}
.cnt{font-size:12.5px;color:var(--mut);margin:0 2px 6px}
.it{background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:block;width:100%;text-align:right;border:0;font:inherit;color:inherit}
.it .t{font-weight:700;font-size:15px;line-height:1.45}.it .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.it .m{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12.5px}
.bar{flex:1;height:7px;background:#e6ece8;border-radius:5px;position:relative;overflow:hidden}.bar i{position:absolute;inset-block:0;right:0;border-radius:5px}.bar u{position:absolute;inset-block:-2px;width:2px;background:#333;opacity:.55}
.chip{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.more{display:block;width:100%;padding:12px;border:1px dashed var(--g);border-radius:12px;background:transparent;color:var(--g);font:inherit;font-weight:600;margin:6px 0 12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--mut);padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;line-height:1}nav button.on{color:var(--g);font-weight:700}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.shh{position:sticky;top:0;background:var(--g);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-radius:18px 18px 0 0;z-index:2}
.shh h2{font-size:16.5px;margin:0;line-height:1.45;flex:1}.shh small{display:block;font-size:12px;opacity:.85;font-weight:400;margin-top:2px}
.sec{background:var(--card);border-radius:14px;margin:10px 12px 0;padding:10px 12px}
.sec h3{margin:0 0 6px;font-size:13.5px;color:var(--g)}
.f{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #eef2ef;font-size:14px}.f:last-child{border-bottom:0}
.f span{color:var(--mut);flex:none}.f b{font-weight:600;text-align:left;direction:ltr;unicode-bidi:plaintext}
.pg{display:flex;flex-direction:column;gap:8px}.pg .bar{flex:none;height:9px}.pg .l{display:flex;justify-content:space-between;font-size:13px}
.ph{display:flex;gap:8px;overflow-x:auto;padding:2px 0}.ph img,.ph .ld{width:140px;height:105px;object-fit:cover;border-radius:10px;background:#e6ece8;flex:none}
.ph .ld{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.shb{display:flex;gap:8px;margin:10px 12px 0}.shb>*{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 6px;font:inherit;font-weight:700;font-size:14.5px;text-decoration:none}
#shPdf{background:#fff;color:var(--g);border:1.5px solid var(--g)}#shWa{background:#25d366;color:#fff}.shm{margin:8px 12px 0;font-size:13px;color:var(--mut);text-align:center}
.route{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;background:var(--g);color:#fff;text-decoration:none;border-radius:12px;padding:13px;font-weight:700;font-size:16px}
.route2{display:block;text-align:center;margin-top:8px;color:var(--g);font-size:13px}
.big{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center}.big img{max-width:100%;max-height:100%}
.dist{background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);width:100%;border:0;font:inherit;text-align:right;color:inherit;display:block}
.dist .t{display:flex;justify-content:space-between;font-weight:700}.dist .s{font-size:12.5px;color:var(--mut);margin-top:3px}
.comp{font-size:13px;padding:7px 0;border-top:1px solid #eef2ef}.comp b{font-weight:600}
.link{max-width:520px;margin:30px auto;background:#fff;border-radius:16px;padding:18px}.link h2{margin:0 0 8px;color:var(--g);font-size:18px}
.link textarea{width:100%;font:15px ui-monospace,Menlo,monospace;direction:ltr;padding:10px;border:1.5px solid var(--g);border-radius:10px;min-height:84px}
.link button{width:100%;margin-top:10px;background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:16px}
.err{color:var(--bad);font-size:13.5px;margin-top:8px}
.load{text-align:center;color:var(--mut);padding:50px 10px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#intro{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s}#intro[hidden]{display:none}#intro.out{opacity:0}
#intro video{width:100%;height:100%;object-fit:cover}#intro .it1{position:absolute;bottom:calc(70px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#f5d27a;font-size:20px;font-weight:800;text-shadow:0 2px 10px #000;animation:itin 1.2s ease 1s both}
#intro .it1 small{display:block;color:#fff;font-size:13px;font-weight:600;margin-top:4px}@keyframes itin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#introX{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:7px 14px;font:inherit;font-size:13px}
#intro .inoff{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ccc;font-size:12.5px}
.nav2{display:flex;gap:8px;margin-top:10px}.nav2 a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 6px;font-weight:700;font-size:15px;text-decoration:none;color:#fff}
.nav2 .gm{background:#1a73e8}.nav2 .wz{background:#33ccff;color:#05233a}.navh{font-weight:700;color:var(--g);margin-top:10px;font-size:14px}
.cc{background:linear-gradient(180deg,#06142a,#0a1f3c);color:#dff7ff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.cc h3{margin:0 0 8px;font-size:13px;color:#38e8ff;font-weight:700;letter-spacing:.3px;border-bottom:1px solid rgba(56,232,255,.2);padding-bottom:5px}
.cck{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cck div{border:1px solid rgba(56,232,255,.22);background:rgba(56,232,255,.06);border-radius:8px;padding:7px 6px;text-align:center}
.cck b{display:block;font-size:19px;color:#fff}.cck span{font-size:11px;color:#8fb3c9}
.ccr{display:grid;grid-template-columns:1fr 46px 54px 46px;gap:6px;align-items:center;font-size:13px;padding:7px 0;border-top:1px solid rgba(56,232,255,.12)}.ccr.h{font-size:11px;color:#8fb3c9;border-top:0;padding-top:0}
.ccr .n{text-align:center;font-weight:700}.ccr .mini{display:block;height:4px;background:rgba(56,232,255,.15);border-radius:3px;margin-top:3px}.ccr .mini i{display:block;height:100%;border-radius:3px}
.ccs{margin:7px 0}.ccs .t{display:flex;justify-content:space-between;font-size:12.5px}.ccs .tr{height:6px;background:rgba(56,232,255,.12);border-radius:4px;position:relative;margin-top:4px}.ccs .tr i{position:absolute;inset-block:0;right:0;background:#38e8ff;border-radius:4px}.ccs .tr u{position:absolute;inset-block:-2px;width:2px;background:#ffc23d}
.ccmap{display:block;width:100%;height:auto;max-height:62vh;background:radial-gradient(ellipse at 45% 45%,rgba(14,111,143,.25),transparent 70%);border:1px solid rgba(56,232,255,.18);border-radius:10px}.ccmap [data-d]{cursor:pointer}
.cca{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0;line-height:1.6}.cca i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px;background:#ff4d6a;box-shadow:0 0 8px #ff4d6a}.cca.w i{background:#ffc23d;box-shadow:0 0 8px #ffc23d}.cca.g i{background:#3dffa8;box-shadow:0 0 8px #3dffa8}
#map{height:calc(100vh - 210px - env(safe-area-inset-bottom));border-radius:14px;overflow:hidden;background:#dfe7e2}
.mlg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin:0 2px 8px}.mlg span{display:inline-flex;align-items:center;gap:4px}.mlg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.leaflet-popup-content{font-family:inherit;direction:rtl;text-align:right;font-size:13.5px;line-height:1.6;margin:10px 12px}.leaflet-popup-content b{font-size:14px}
.pbtn{display:block;width:100%;margin-top:6px;background:var(--g);color:#fff;border:0;border-radius:9px;padding:8px;font:inherit;font-weight:700}
.eng{background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:11px 12px}
.eng summary{list-style:none;cursor:pointer}.eng summary::-webkit-details-marker{display:none}
.eng .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}.eng .t em{font-style:normal;background:#e7f1ea;color:var(--g);border-radius:20px;padding:0 9px;font-size:12.5px;white-space:nowrap;align-self:flex-start}
.eng .s{font-size:12.5px;color:var(--mut);margin-top:2px}.eng .ep{font-size:13px;padding:8px 0;border-top:1px solid #eef2ef;cursor:pointer}
</style>
</head>
<body>
<header><div><h1>صفحة كبار الشخصيات للاطلاع</h1><small>موقف المشاريع — محافظة الأنبار / قسم الشؤون الهندسية</small></div><span class="sp"></span><button class="hbtn" id="bRef" type="button">🔄 تحديث</button></header>
<div class="upd" id="upd"></div>
<main id="main"><div class="load">⏳ جارٍ التحميل…</div></main>
<nav id="nav" hidden><button class="on" data-v="sit"><b>📊</b>الموقف</button><button data-v="cc"><b>🛰</b>المركز</button><button data-v="map"><b>📍</b>الخريطة</button><button data-v="eng"><b>👷</b>المشرفون</button><button data-v="pl"><b>📐</b>التخطيط</button></nav>
<div id="intro" hidden><video id="introV" muted playsinline webkit-playsinline preload="auto"></video><div class="it1">صفحة كبار الشخصيات للاطلاع<small>محافظة الأنبار — قسم الشؤون الهندسية</small></div><button type="button" id="introX">تخطي ✕</button><label class="inoff"><input type="checkbox" id="introOff"> عدم عرض المقدمة مرة أخرى</label></div>
<div class="sheet" id="sheet" hidden><div class="sh" id="sh"></div></div>
<script>
/* أي خطأ في الصفحة يُكتب على الشاشة (للتشخيص على iPhone) بدل أن تبقى «جارٍ التحميل» */
(function(){const show=m=>{try{const u=document.getElementById('upd');if(u){u.className='upd bad';u.textContent='⚠ خطأ في الصفحة: '+m;}const mm=document.getElementById('main');if(mm&&/جارٍ التحميل/.test(mm.textContent))mm.innerHTML='<div class="load">⚠ '+String(m).replace(/</g,'&lt;')+'</div>';}catch(_){}};
  window.addEventListener('error',e=>show((e.message||'')+(e.lineno?' (سطر '+e.lineno+')':'')));window.addEventListener('unhandledrejection',e=>show(e.reason&&e.reason.message||String(e.reason)));})();
</script>
